<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>omp stats</title>
    <style>
      :root,
      [data-theme='dark'] {
        color-scheme: dark;
        --bg: #000000;
        --panel: #09090a;
        --card: #0e0e10;
        --raised: #17171a;
        --hover: rgba(255, 255, 255, 0.035);
        --line-1: rgba(255, 255, 255, 0.06);
        --line-2: rgba(255, 255, 255, 0.09);
        --line-3: rgba(255, 255, 255, 0.14);
        --ink-1: #ededef;
        --ink-2: #a0a0a8;
        --ink-3: #6c6c74;
        --accent-a: #5ad8e6;
        --accent-b: #ed4abf;
        --ok: #3ecf8e;
        --ok-soft: rgba(62, 207, 142, 0.13);
        --bad: #ff6166;
        --bad-soft: rgba(255, 97, 102, 0.13);
        --live: #3ecf8e;
        --chart-grid: rgba(255, 255, 255, 0.055);
        --chart-axis: #5c5c64;
        --chart-primary: #5ad8e6;
        --chart-secondary: #ed4abf;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.45);
        --font-sans: 'Inter var', 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
        --r-control: 8px;
        --r-card: 12px;
        --r-pill: 999px;
      }

      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--panel);
        color: var(--ink-1);
        font-family: var(--font-sans);
        font-size: 12.5px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        background: transparent;
        border: 0;
        padding: 0;
      }

      .mono {
        font-family: var(--font-mono);
        font-size: 0.93em;
      }

      .num {
        font-family: var(--font-mono);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
        font-size: 0.93em;
      }

      .muted {
        color: var(--ink-2);
      }

      .dim {
        color: var(--ink-3);
      }

      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .page {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 12px 10px 24px;
      }

      /* Topbar */
      .topbar-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .topbar-controls {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .status-group {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
      }

      .live-chip {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 26px;
        padding: 0 9px;
        border-radius: var(--r-control);
        border: 1px solid var(--line-2);
        background: var(--card);
        color: var(--ink-2);
        font-size: 11.5px;
        white-space: nowrap;
      }
      .live-chip:hover {
        border-color: var(--line-3);
        color: var(--ink-1);
      }

      .refresh-btn {
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 26px;
        padding: 0 10px;
        border-radius: var(--r-control);
        border: 1px solid var(--line-2);
        background: var(--card);
        color: var(--ink-2);
        font-size: 11.5px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      .refresh-btn:hover:not(:disabled) {
        border-color: var(--line-3);
        color: var(--ink-1);
        background: var(--raised);
      }

      .refresh-btn:active:not(:disabled) {
        transform: scale(0.97);
      }

      .refresh-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .refresh-icon {
        display: inline-block;
        font-size: 13px;
        line-height: 1;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .spin {
        animation: spin 0.8s linear infinite;
      }

      .topbar-icon-card {
        width: 58px;
        height: 58px;
        border-radius: 14px;
        border: 1px solid var(--line-2);
        background: #120a14;
        box-shadow: 0 4px 16px rgba(237, 74, 191, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .topbar-icon-card:hover {
        transform: scale(1.04);
        box-shadow: 0 6px 20px rgba(237, 74, 191, 0.35);
      }

      .topbar-icon {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .live-chip-count {
        font-family: var(--font-mono);
        color: var(--ink-3);
        font-size: 10.5px;
      }

      @keyframes ping {
        0% {
          transform: scale(1);
          opacity: 0.7;
        }
        80%,
        to {
          transform: scale(2.4);
          opacity: 0;
        }
      }

      .dot {
        position: relative;
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--live);
        flex-shrink: 0;
      }

      .dot[data-pulse='true']:after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: inherit;
        animation: ping 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* Segmented control */
      .segmented {
        display: inline-flex;
        align-items: center;
        border-radius: var(--r-control);
        background: var(--card);
        border: 1px solid var(--line-2);
        padding: 2px;
        gap: 1px;
      }

      .topbar-controls .segmented {
        display: flex;
        width: 100%;
      }

      .segmented-option {
        color: var(--ink-3);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        height: 22px;
        padding: 0 7px;
        border-radius: 6px;
        font-size: 11.5px;
        font-weight: 500;
        transition: all 0.12s ease;
      }

      .topbar-controls .segmented-option {
        flex: 1;
        min-width: 0;
        justify-content: center;
        text-align: center;
        padding: 0 2px;
      }
        color: var(--ink-1);
      }

      .segmented-option[data-active='true'] {
        color: var(--ink-1);
        background: var(--raised);
        border: 1px solid var(--line-3);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      }

      /* Page header */
      .page-header {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .page-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      .page-description {
        color: var(--ink-2);
        font-size: 12px;
      }

      /* Stat grids (Row 1: 5 KPIs with sparklines; Row 2: 8 secondary cells) */
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(var(--stat-min, 130px), 1fr));
        border-radius: var(--r-card);
        background:
          linear-gradient(var(--card), var(--card)) padding-box,
          linear-gradient(180deg, var(--line-3), var(--line-1) 40%) border-box;
        border: 1px solid transparent;
        box-shadow: var(--shadow-1);
        overflow: hidden;
      }

      .stat-grid[data-strip='sm'] {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .stat {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        padding: 11px 12px 10px;
        box-shadow:
          1px 0 0 var(--line-1),
          0 1px 0 var(--line-1);
      }

      .stat[data-size='sm'] {
        padding: 8px 5px;
        gap: 2px;
      }

      .stat-label {
        color: var(--ink-2);
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stat[data-size='sm'] .stat-label {
        font-size: 9px;
        letter-spacing: -0.02em;
      }

      .stat-value {
        letter-spacing: -0.025em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.15;
      }

      .stat[data-size='sm'] .stat-value {
        font-size: 14.5px;
      }

      .stat-foot {
        color: var(--ink-3);
        font-size: 11px;
        min-height: 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .stat-spark {
        height: 24px;
        margin-top: 2px;
      }

      .stat-spark svg {
        width: 100%;
        height: 24px;
        overflow: visible;
      }

      /* Cards */
      .card {
        position: relative;
        border-radius: var(--r-card);
        background:
          linear-gradient(var(--card), var(--card)) padding-box,
          linear-gradient(180deg, var(--line-3), var(--line-1) 40%) border-box;
        border: 1px solid transparent;
        box-shadow: var(--shadow-1);
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
      }

      .card-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        padding: 12px 14px 0;
      }

      .card-titles {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .card-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: -0.005em;
      }

      .card-description {
        color: var(--ink-3);
        font-size: 11.5px;
      }

      .card-body {
        padding: 12px 14px 14px;
        min-width: 0;
      }

      .card-body[data-flush='true'] {
        padding: 8px 0 0;
      }

      /* Activity SVG chart */
      .chart-svg {
        width: 100%;
        height: auto;
        display: block;
        overflow: visible;
      }

      /* Token mix & By agent */
      .stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }

      .share-bar {
        display: flex;
        width: 100%;
        height: 8px;
        border-radius: var(--r-pill);
        background: var(--raised);
        overflow: hidden;
        gap: 2px;
      }

      .share-bar-seg {
        height: 100%;
        min-width: 3px;
        border-radius: 2px;
      }

      .legend-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 12px;
        font-size: 11.5px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--ink-2);
        white-space: nowrap;
      }

      .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .section-label {
        color: var(--ink-3);
        font-size: 11.5px;
        font-weight: 500;
      }

      .agent-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      /* Latest requests table */
      .table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
        font-size: 12px;
      }

      .table th {
        text-align: left;
        color: var(--ink-3);
        white-space: nowrap;
        background: var(--card);
        border-bottom: 1px solid var(--line-1);
        padding: 7px 8px;
        font-size: 11px;
        font-weight: 500;
      }

      .table th:first-child,
      .table td:first-child {
        padding-left: 14px;
      }

      .table th:last-child,
      .table td:last-child {
        padding-right: 14px;
      }

      .table th.right,
      .table td.right {
        text-align: right;
      }

      .table tbody tr {
        border-bottom: 1px solid var(--line-1);
      }

      .table tbody tr:last-child {
        border-bottom: none;
      }

      .table tbody tr:hover {
        background: var(--hover);
      }

      .table td {
        padding: 7px 8px;
        vertical-align: middle;
        overflow: hidden;
      }

      .cell-primary {
        color: var(--ink-1);
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cell-secondary {
        color: var(--ink-3);
        font-size: 10.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        height: 19px;
        padding: 0 7px;
        border-radius: var(--r-pill);
        font-size: 10.5px;
        font-weight: 500;
      }

      .badge[data-tone='ok'] {
        background: var(--ok-soft);
        color: var(--ok);
      }

      .badge[data-tone='bad'] {
        background: var(--bad-soft);
        color: var(--bad);
      }

      .badge[data-tone='warn'] {
        background: rgba(245, 165, 36, 0.16);
        color: #f5a524;
      }

      .table-wrap {
        overflow-x: auto;
        min-width: 0;
        -webkit-overflow-scrolling: touch;
      }

      /* Sub-tabs bar (Overview | Models) */
      .tabs {
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line-1);
        padding: 0 2px;
      }

      .tab {
        position: relative;
        color: var(--ink-3);
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        font-size: 12.5px;
        font-weight: 500;
      }

      .tab:hover,
      .tab[data-active='true'] {
        color: var(--ink-1);
      }

      .tab[data-active='true']:after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: -1px;
        height: 2px;
        border-radius: 2px;
        background: linear-gradient(100deg, var(--accent-a), var(--accent-b));
      }

      .tab-badge {
        display: inline-flex;
        align-items: center;
        height: 17px;
        padding: 0 5px;
        border-radius: var(--r-pill);
        background: var(--raised);
        border: 1px solid var(--line-1);
        color: var(--ink-2);
        font-size: 10px;
      }

      /* Models table meter & expandable row details */
      .meter {
        position: relative;
        width: 48px;
        height: 4px;
        border-radius: 2px;
        background: var(--line-1);
        overflow: hidden;
        margin-left: auto;
        margin-top: 3px;
      }

      .meter-fill {
        height: 100%;
        border-radius: 2px;
      }

      .clickable-row {
        cursor: pointer;
      }

      .models-chevron {
        display: inline-block;
        color: var(--ink-3);
        font-size: 10px;
        width: 10px;
        transition: transform 0.15s ease;
      }

      .models-chevron[data-open='true'] {
        transform: rotate(90deg);
        color: var(--ink-1);
      }

      .detail-row td {
        background: rgba(255, 255, 255, 0.02);
        padding: 8px 10px 10px !important;
      }

      .models-detail {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .models-detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .detail-dl {
        margin: 4px 0 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }

      .detail-dl > div {
        display: flex;
        justify-content: space-between;
        gap: 4px;
        font-size: 10.5px;
      }

      .detail-dl dt {
        color: var(--ink-3);
      }

      .detail-dl dd {
        margin: 0;
        color: var(--ink-1);
      }
      .models-detail-chart {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line-1);
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .chart-legend {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--ink-2);
      }
      .empty {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--ink-3);
        min-height: 90px;
        padding: 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root" class="page"></div>
    <script type="module" src="./panel.ts"></script>
  </body>
</html>
